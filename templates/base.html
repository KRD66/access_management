<!DOCTYPE html>
<html>
<head>
    <title>Access System</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <nav class="bg-white shadow p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-xl font-bold">Access System</a>
            <div class="space-x-4">
                <a href="{% url 'dashboard' %}" class="text-blue-600 hover:underline">Dashboard</a>
                <a href="{% url 'user_list' %}" class="text-blue-600 hover:underline">Users</a>
                <a href="{% url 'device_list' %}" class="text-blue-600 hover:underline">Devices</a>
                <a href="{% url 'enroll_user' %}" class="text-blue-600 hover:underline">Enroll User</a>
                <a href="/admin/" class="text-blue-600 hover:underline">Admin</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'logout' %}" class="text-blue-600 hover:underline">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="text-blue-600 hover:underline">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mx-auto mt-6">
        {% if messages %}
            {% for message in messages %}
                <div class="bg-{{ message.tags }}-100 border-l-4 border-{{ message.tags }}-500 text-{{ message.tags }}-700 p-4 mb-4 rounded-md">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
