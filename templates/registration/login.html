{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-50 flex items-center justify-center px-4">
    <div class="max-w-md w-full">
        <div class="text-center mb-10">
            <h1 class="text-5xl font-bold text-blue-700 mb-2">Access System</h1>
            <p class="text-xl text-gray-700">Voice Biometric Login</p>
        </div>

        <div class="bg-white rounded-2xl shadow-2xl p-10 border border-gray-100">
            <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Say Your Phrase</h2>

            <form method="post" id="voice-login-form">
                {% csrf_token %}
                
                <div class="mb-8">
                    <label class="block text-lg font-semibold text-gray-700 mb-3">Username</label>
                    <input type="text" name="username" required autofocus 
                           class="w-full px-5 py-4 text-lg border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition"
                           placeholder="Enter your username">
                </div>

                <div class="text-center">
                    <button type="button" id="record-btn" 
                            class="bg-gradient-to-r from-purple-600 to-blue-600 text-white font-bold text-xl px-12 py-6 rounded-full hover:shadow-2xl transform hover:scale-105 transition duration-300">
                        Hold to Record Voice
                    </button>
                    <p id="status" class="mt-4 text-gray-600 text-lg">Click and speak your phrase</p>
                </div>

                <input type="hidden" name="voice_data" id="voice-data">
            </form>

            <div class="mt-10 text-center">
                <p class="text-sm text-gray-500">
                    Secure • Passwordless • Biometric Only
                </p>
            </div>
        </div>
    </div>
</div>

<script>
let recorder, audioBlob;
const status = document.getElementById('status');
const recordBtn = document.getElementById('record-btn');
const voiceInput = document.getElementById('voice-data');

async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recorder = new MediaRecorder(stream);
        const chunks = [];

        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            audioBlob = new Blob(chunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onloadend = () => {
                voiceInput.value = reader.result;
                document.getElementById('voice-login-form').submit();
            };
            reader.readAsDataURL(audioBlob);
        };

        recorder.start();
        recordBtn.textContent = "Recording... Release to Login";
        recordBtn.classList.add('bg-red-600');
        status.textContent = "Recording... Speak your phrase now";
        status.className = "mt-4 text-xl font-bold text-green-600";
    } catch (err) {
        status.textContent = "Microphone access denied";
        status.className = "mt-4 text-red-600";
    }
}

recordBtn.addEventListener('mousedown', startRecording);
recordBtn.addEventListener('touchstart', startRecording);
recordBtn.addEventListener('mouseup', () => recorder?.stop());
recordBtn.addEventListener('touchend', () => recorder?.stop());
recordBtn.addEventListener('mouseleave', () => recorder?.stop());
</script>
{% endblock %}
