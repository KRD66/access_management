{% extends "base.html" %}
{% block content %}
<div class="min-h-screen bg-gradient-to-br from-blue-50 to-purple-50 flex items-center justify-center px-4">
    <div class="max-w-2xl w-full">
        <h1 class="text-5xl font-bold text-center text-blue-700 mb-12">Voice Access Gate</h1>

        <!-- Messages — FIXED -->
        {% if messages %}
            <div class="mb-8 space-y-4">
                {% for message in messages %}
                    <div class="p-6 rounded-xl text-center text-2xl font-bold {% if message.tags == 'error' %}bg-red-100 text-red-700 border border-red-300{% else %}bg-green-100 text-green-700 border border-green-300{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <div class="bg-white rounded-3xl shadow-2xl p-12 text-center">
            <form method="post" id="voice-form">
                {% csrf_token %}
                <div class="mb-10">
                    <label class="block text-2xl font-medium text-gray-700 mb-4">Enter Your Username</label>
                    <input type="text" name="username" required autofocus 
                           class="w-full max-w-md mx-auto px-8 py-6 text-2xl border-2 border-gray-300 rounded-xl focus:border-blue-500 text-center">
                </div>

                <div class="bg-purple-50 p-10 rounded-2xl">
                    <p class="text-2xl text-gray-800 mb-8">Click and say your voice phrase</p>
                    <button type="button" id="record-btn" 
                            class="bg-gradient-to-r from-purple-600 to-blue-600 text-white font-bold text-3xl px-16 py-12 rounded-full hover:scale-105 transition shadow-2xl">
                        Hold to Speak
                    </button>
                    <p id="status" class="mt-6 text-xl text-gray-600">Ready when you are</p>
                </div>

                <input type="hidden" name="voice_data" id="voice_data">
            </form>
        </div>
    </div>
</div>

<script>
let recorder;
const recordBtn = document.getElementById('record-btn');
const status = document.getElementById('status');
const voiceInput = document.getElementById('voice_data');

recordBtn.addEventListener('mousedown', startRecording);
recordBtn.addEventListener('touchstart', startRecording);
recordBtn.addEventListener('mouseup', () => recorder?.stop());
recordBtn.addEventListener('touchend', () => recorder?.stop());

async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recorder = new MediaRecorder(stream);
        const chunks = [];

        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onload = () => {
                voiceInput.value = reader.result;
                document.getElementById('voice-form').submit();
            };
            reader.readAsDataURL(blob);
        };

        recorder.start();
        recordBtn.textContent = "Recording... Release to Submit";
        recordBtn.classList.add('bg-red-600');
        status.textContent = "Speak your phrase clearly now";
        status.className = "mt-6 text-2xl font-bold text-green-600";
    } catch (err) {
        status.textContent = "Microphone access denied";
        status.className = "mt-6 text-2xl font-bold text-red-600";
    }
}
</script>
{% endblock %}
