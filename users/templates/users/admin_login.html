{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-gradient-to-br from-blue-50 to-purple-50 flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-10">
        <h1 class="text-4xl font-bold text-center text-blue-700 mb-8">Admin Login</h1>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-6 p-4 rounded-lg text-center font-bold bg-red-100 text-red-700">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-lg font-medium text-gray-700 mb-2">Username</label>
                <input type="text" name="username" required class="w-full px-5 py-4 border-2 border-gray-300 rounded-xl text-lg focus:border-blue-500">
            </div>
            <div>
                <label class="block text-lg font-medium text-gray-700 mb-2">Password</label>
                <input type="password" name="password" required class="w-full px-5 py-4 border-2 border-gray-300 rounded-xl text-lg focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold text-xl py-5 rounded-full hover:scale-105 transition">
                Login as Admin
            </button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-8">
            Regular users use voice login at the main page.
        </p>
    </div>
</div>
{% endblock %}
