{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl p-10 mt-10">
    <h1 class="text-4xl font-bold text-center text-blue-700 mb-8">Enroll New User</h1>

    {% if messages %}
        {% for message in messages %}
            <div class="mb-6 p-4 rounded-lg text-center font-bold {% if 'error' in message.tags %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post" class="space-y-8">
        {% csrf_token %}

        <input type="text" name="username" required placeholder="Username *" required class="w-full px-5 py-4 border-2 rounded-xl text-lg">
        
        <input type="text" name="voice_phrase" placeholder="Voice Phrase * (e.g. open sesame)" required class="w-full px-5 py-4 border-2 rounded-xl text-lg">

        <select name="role" class="w-full px-5 py-4 border-2 rounded-xl text-lg">
            <option value="user">Regular User</option>
            <option value="admin">Administrator (Full Access)</option>
        </select>

        <div class="bg-purple-50 p-8 rounded-xl border-2 border-purple-300">
            <h3 class="text-2xl font-bold text-purple-800 mb-4">Record Voice 3 Times</h3>
            <p class="text-gray-700 mb-6">Say your phrase clearly each time</p>

            <div class="space-y-5">
                <div class="flex items-center gap-4">
                    <button type="button" id="rec1" class="rec-btn">Record #1</button>
                    <span id="s1" class="font-medium">Not recorded</span>
                </div>
                <div class="flex items-center gap-4">
                    <button type="button" id="rec2" class="rec-btn" disabled>Record #2</button>
                    <span id="s2" class="font-medium">Not recorded</span>
                </div>
                <div class="flex items-center gap-4">
                    <button type="button" id="rec3" class="rec-btn" disabled>Record #3</button>
                    <span id="s3" class="font-medium">Not recorded</span>
                </div>
            </div>
        </div>

        <button type="submit" id="submit" disabled class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold text-xl py-5 rounded-full hover:scale-105 transition opacity-60">
            Enroll User – Voice Login Ready
        </button>
    </form>

    <input type="hidden" name="voiceprint1" id="voiceprint1">
    <input type="hidden" name="voiceprint2" id="voiceprint2">
    <input type="hidden" name="voiceprint3" id="voiceprint3">

    <script>
        let count = 0;
        const btns = document.querySelectorAll('.rec-btn');
        const status = [document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3')];
        const inputs = [document.getElementById('voiceprint1'), document.getElementById('voiceprint2'), document.getElementById('voiceprint3')];

        btns.forEach((btn, i) => {
            btn.onclick = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
                    const recorder = new MediaRecorder(stream);
                    const chunks = [];

                    recorder.ondataavailable = e => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, {type: 'audio/webm'});
                        const reader = new FileReader();
                        reader.onload = () => {
                            inputs[i].value = reader.result;
                            status[i].textContent = "Done";
                            status[i].className = "font-bold text-green-600";
                            count++;
                            if (count === 3) {
                                document.getElementById('submit').disabled = false;
                                document.getElementById('submit').classList.remove('opacity-60');
                            } else if (count < 3) {
                                btns[count].disabled = false;
                            }
                        };
                        reader.readAsDataURL(blob);
                    };

                    recorder.start();
                    btn.textContent = "Recording...";
                    btn.classList.add('bg-red-600');
                    setTimeout(() => recorder.stop(), 4000);
                    stream.getTracks().forEach(t => t.stop());
                } catch (e) {
                    status[i].textContent = "Mic blocked";
                    status[i].className = "text-red-600";
                }
            };
        });
    </script>
</div>
{% endblock %}
